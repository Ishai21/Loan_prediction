name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  CONTAINER_NAME: loan-prediction

jobs:
  # ---------------------------------------------------------------- 1. test
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 120 --retries 10 -r requirements-dev.txt

      - name: Verify dependency resolution is conflict-free
        run: pip check

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Verify Docker image builds
        run: docker build -t ${{ env.CONTAINER_NAME }}:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 8501:8501 -p 8000:8000 ${{ env.CONTAINER_NAME }}:ci

          echo "Waiting for services to come up..."
          for i in $(seq 1 30); do
            api=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8000/docs || true)
            ui=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8501/_stcore/health || true)
            if [ "$api" = "200" ] && [ "$ui" = "200" ]; then
              echo "Both services healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Services did not become healthy within 30s"
          docker logs smoke
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

  # ------------------------------------------------------- 2. build and push
  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.ECR_REPOSITORY }}:latest\`" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------- 3. deploy
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The registry password is minted here and passed to the instance, so the
      # EC2 box needs neither the AWS CLI nor any stored AWS credentials.
      # The registry token is minted on the runner and passed to the instance,
      # so EC2 needs neither the AWS CLI nor any stored AWS credentials.
      - name: Mint ECR token for the instance
        run: |
          TOKEN=$(aws ecr get-login-password --region "${{ secrets.AWS_REGION }}")
          echo "::add-mask::$TOKEN"
          echo "ECR_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_PASSWORD: ${{ env.ECR_PASSWORD }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,REPOSITORY,IMAGE_TAG,ECR_PASSWORD,CONTAINER_NAME
          script_stop: true
          script: |
            set -euo pipefail

            IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
            echo "Deploying $IMAGE"

            printf '%s' "$ECR_PASSWORD" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            docker pull "$IMAGE"

            # Keep a reference to the current image so we can roll back.
            PREVIOUS=$(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || echo "")

            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8501:8501 \
              -p 8000:8000 \
              "$IMAGE"

            echo "Waiting for health..."
            for i in $(seq 1 60); do
              api=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8000/docs || true)
              ui=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8501/_stcore/health || true)
              if [ "$api" = "200" ] && [ "$ui" = "200" ]; then
                echo "Deploy healthy after ${i}s"
                # t2.micro has 1 GB of RAM -- reclaim space from old images.
                docker image prune -af --filter "until=24h" || true
                exit 0
              fi
              sleep 2
            done

            echo "Deploy failed health check. Container logs:"
            docker logs --tail 50 "$CONTAINER_NAME" || true

            if [ -n "$PREVIOUS" ]; then
              echo "Rolling back to $PREVIOUS"
              docker rm -f "$CONTAINER_NAME" || true
              docker run -d --name "$CONTAINER_NAME" --restart unless-stopped \
                -p 8501:8501 -p 8000:8000 "$PREVIOUS"
            fi
            exit 1

      - name: Summary
        run: |
          echo "### Deployed to EC2" >> $GITHUB_STEP_SUMMARY
          echo "- Commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Streamlit UI: port 8501" >> $GITHUB_STEP_SUMMARY
          echo "- FastAPI docs: port 8000/docs" >> $GITHUB_STEP_SUMMARY
